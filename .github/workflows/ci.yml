name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# Placeholder env so typecheck/lint/build/unit-tests run without secrets.
# DB-backed isolation tests skip automatically when DATABASE_URL is unset.
env:
  BETTER_AUTH_SECRET: ci-better-auth-secret-0123456789abcdef
  BETTER_AUTH_URL: http://localhost:3000
  NEXT_PUBLIC_APP_URL: http://localhost:3000
  INTEGRATION_WEBHOOK_SECRET: ci-webhook-secret-0123456789abcdef
  DATABASE_URL: postgresql://placeholder:placeholder@localhost:5432/placeholder

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 10

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Typecheck
        run: pnpm typecheck

      - name: Lint
        run: pnpm lint

      - name: Unit & integration tests
        run: pnpm test

      - name: Production build
        run: pnpm build
